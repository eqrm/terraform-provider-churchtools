name: CI
on:
  # Markdown and the licence feed neither the build nor the tests nor the goreleaser
  # config. Nothing here is a required status check; if CI ever becomes one, drop
  # these filters, or a docs-only PR would wait forever on a check that never runs.
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

# A newer push to the same PR supersedes the run in flight, so cancel it rather than
# let both occupy the org's concurrent-job slots. Pushes to main are never cancelled:
# every main commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -v -race
        env:
          TF_ACC: "1"

  # The release config is only exercised by a tag, so without this it would be
  # first discovered to be wrong while cutting a release — and a release that
  # half-happens leaves a tag the registry may already have seen. `check` is
  # config validation only: it builds and signs nothing.
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check
